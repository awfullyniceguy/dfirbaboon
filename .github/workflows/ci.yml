name: DFIR Baboon CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    name: Python Linting & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt pytest

      - name: Validate Python Syntax
        run: |
          python3 -m py_compile worker/config.py worker/entrypoint.py worker/parsers/*.py

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

  terraform-validate:
    name: Terraform Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

  docker-build:
    name: Hardened Docker Build & Non-Root Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: worker/
          file: worker/Dockerfile
          platforms: linux/amd64
          tags: dfirbaboon-worker:ci
          load: true

      - name: Verify Non-Root User Execution
        run: |
          USER=$(docker run --rm --entrypoint whoami dfirbaboon-worker:ci)
          echo "Container runtime user: $USER"
          if [ "$USER" != "dfirworker" ]; then
            echo "Error: Container must run as non-root user 'dfirworker', got '$USER'"
            exit 1
          fi
